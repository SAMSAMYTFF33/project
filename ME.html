<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متتبع الصلاة والحفظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302a;--mu:#5d756d;--g:#0f6b57;--gs:#d8ece5;--gold:#b8891f;--ln:#d5e1dc;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a17;--card:#14251f;--ink:#e6f1ec;--mu:#8aa69b;--g:#3cc4a0;--gs:#1b3a31;--gold:#e0b84a;--ln:#23382f;--on:#08140f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-top:14px}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
.mu{color:var(--mu);font-size:.9rem}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--card);font-size:1.2rem}
.nav button:disabled{opacity:.35;cursor:default}
#date{font-weight:800;font-size:1.2rem;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;padding:18px 0 4px}
.ring{width:150px;height:150px}
.ring path{fill:none;stroke:var(--ln);stroke-width:9;stroke-linecap:round}
.ring path.on{stroke:var(--g)}
.ring text{fill:var(--ink);font-family:inherit;font-weight:800;font-size:26px;text-anchor:middle}
.ring .sm{font-size:9px;font-weight:500;fill:var(--mu)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row b{font-size:1.05rem;min-width:56px}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--ln);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip.on.s1{background:var(--gs);border-color:var(--g);color:var(--g);font-weight:700}
.chip.on.s2{background:var(--g);border-color:var(--g);color:var(--on);font-weight:700}
.chip.on.s3{background:var(--gold);border-color:var(--gold);color:var(--on);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
li:first-child{border-top:0}
li span{flex:1;word-break:break-word}
li .done{text-decoration:line-through;color:var(--mu)}
.st{border-radius:999px;border:1px solid var(--ln);background:transparent;padding:4px 12px;font-size:.82rem;white-space:nowrap}
.st1{background:var(--gs);border-color:var(--g);color:var(--g)}
.st2{background:var(--g);border-color:var(--g);color:var(--on)}
.del{border:0;background:none;color:var(--mu);font-size:1.3rem;padding:0 6px}
form{display:flex;gap:8px;margin-top:12px}
input[type=text]{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;border-radius:10px;background:var(--g);color:var(--on);padding:10px 18px;font-weight:700}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--ln);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat strong{display:block;font-size:1.6rem;font-weight:800;line-height:1.2}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.78rem;color:var(--mu)}
.bar i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--g);min-height:3px}
.bar i.z{background:var(--ln)}
.bar b{color:var(--ink);font-size:.82rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<main>
  <div class="nav">
    <button id="prev" aria-label="اليوم السابق">›</button>
    <div id="date"></div>
    <button id="next" aria-label="اليوم التالي">‹</button>
  </div>

  <section class="card hero">
    <svg class="ring" viewBox="0 0 120 120" id="ring" role="img" aria-label="تقدم الصلوات"></svg>
    <p class="mu" style="margin:6px 0 0">اضغط مرة ثانية على الخيار لإلغائه</p>
  </section>

  <section class="card">
    <h2>الصلوات المفروضة</h2>
    <div id="prayers"></div>
  </section>

  <section class="card">
    <h2>حفظ الدروس</h2>
    <ul id="lessons"></ul>
    <form id="lf">
      <input type="text" id="lt" placeholder="اسم الدرس أو السورة" maxlength="80" autocomplete="off" aria-label="اسم الدرس">
      <button class="btn" type="submit">أضف درساً</button>
    </form>
    <p class="mu" style="margin:10px 0 0">اضغط على حالة الدرس لتغييرها: لم أبدأ، أحفظ حالياً، حفظته.</p>
  </section>

  <section class="card">
    <h2>الإحصائيات</h2>
    <div class="grid" id="stats"></div>
    <div class="bars" id="bars"></div>
    <p class="mu" style="margin:8px 0 0">عدد الصلوات في آخر 7 أيام</p>
    <div class="tools">
      <button class="btn" id="link" hidden>ربط ملف بياناتك</button>
      <button class="btn o" id="exp">نسخ احتياطي</button>
      <button class="btn o" id="imp">استرجاع نسخة</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <p class="mu" id="st" style="margin:10px 0 0" role="status"></p>
    <p class="mu" style="margin:6px 0 0">بياناتك محفوظة في متصفحك. للحفظ في ملف تختاره بنفسك اضغط «ربط ملف بياناتك»، وإن لم يدعمه متصفحك استخدم النسخ الاحتياطي.</p>
  </section>
</main>

<script>
const P=[['fajr','الفجر'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
const PS=['','في وقتها','جماعة','قضاء'];
const LS=['لم أبدأ','أحفظ حالياً','حفظته'];
const $=id=>document.getElementById(id);
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>{const[a,b,c]=k.split('-');return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={days:{}};
try{const r=JSON.parse(localStorage.getItem('trk1'));if(r&&r.days)db=r}catch(e){}
let cur=key(new Date());
const FS='showSaveFilePicker' in window;
let fh=null;
const setSt=t=>{$('st').textContent=t};
const idb=(m,k,v)=>new Promise(res=>{try{const o=indexedDB.open('trkh',1);o.onupgradeneeded=()=>o.result.createObjectStore('s');o.onsuccess=()=>{const s=o.result.transaction('s',m==='get'?'readonly':'readwrite').objectStore('s'),r=m==='get'?s.get(k):s.put(v,k);r.onsuccess=()=>res(r.result);r.onerror=()=>res()};o.onerror=()=>res()}catch(e){res()}});
async function writeFile(){
  if(!fh)return;
  try{
    if(await fh.queryPermission({mode:'readwrite'})!=='granted'){setSt('الملف مربوط لكن يحتاج إذنك. اضغط «ربط ملف بياناتك».');return}
    const w=await fh.createWritable();await w.write(JSON.stringify(db));await w.close();
    setSt('تم الحفظ في الملف: '+fh.name);
  }catch(e){setSt('تعذر الكتابة في الملف. اضغط «ربط ملف بياناتك» من جديد.')}
}
async function syncFromFile(ask){
  try{
    const t=await(await fh.getFile()).text();let j=null;
    try{j=JSON.parse(t)}catch(_){}
    if(j&&j.days&&Object.keys(j.days).length){
      if(ask&&Object.keys(db.days).length&&!confirm('الملف فيه بيانات سابقة. تحميلها يستبدل بيانات هذه الصفحة. هل تريد المتابعة؟')){fh=null;await idb('put','fh',null);setSt('تم إلغاء الربط.');return}
      db=j;try{localStorage.setItem('trk1',JSON.stringify(db))}catch(e){}
      render();setSt('تم تحميل بياناتك من الملف: '+fh.name);
    }else await writeFile();
  }catch(e){setSt('تعذر قراءة الملف.')}
}
const save=()=>{try{localStorage.setItem('trk1',JSON.stringify(db))}catch(e){}writeFile()};
const day=k=>db.days[k]||(db.days[k]={p:{},l:[]});
const pc=k=>{const d=db.days[k];return d?P.filter(([id])=>d.p[id]>0).length:0};
const keys=n=>{const t=new Date(),a=[];for(let i=n-1;i>=0;i--)a.push(key(new Date(t.getFullYear(),t.getMonth(),t.getDate()-i)));return a};
const pct=n=>Math.round(keys(n).reduce((s,k)=>s+pc(k),0)/(n*5)*100);
const mem=ks=>ks.reduce((s,k)=>s+((db.days[k]&&db.days[k].l)||[]).filter(l=>l.s===2).length,0);
function streak(){let c=0,d=new Date();if(pc(key(d))<5)d.setDate(d.getDate()-1);while(pc(key(d))===5){c++;d.setDate(d.getDate()-1)}return c}

function render(){
  const d=db.days[cur]||{p:{},l:[]},today=key(new Date());
  $('date').textContent=(cur===today?'اليوم، ':'')+pd(cur).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});
  $('next').disabled=cur>=today;

  let arcs='';
  for(let i=0;i<5;i++){
    const a0=(-90+i*72+7)*Math.PI/180,a1=(-90+(i+1)*72-7)*Math.PI/180,r=52;
    arcs+=`<path class="${d.p[P[i][0]]>0?'on':''}" d="M${60+r*Math.cos(a0)} ${60+r*Math.sin(a0)}A${r} ${r} 0 0 1 ${60+r*Math.cos(a1)} ${60+r*Math.sin(a1)}"/>`;
  }
  $('ring').innerHTML=arcs+`<text x="60" y="64">${pc(cur)}/5</text><text class="sm" x="60" y="80">صلوات</text>`;

  $('prayers').innerHTML=P.map(([id,nm])=>`<div class="row"><b>${nm}</b><div class="chips">${[1,2,3].map(s=>`<button class="chip s${s} ${d.p[id]===s?'on':''}" data-p="${id}" data-s="${s}">${PS[s]}</button>`).join('')}</div></div>`).join('');

  $('lessons').innerHTML=d.l.length?d.l.map((x,i)=>`<li><button class="st st${x.s}" data-l="${i}">${LS[x.s]}</button><span class="${x.s===2?'done':''}">${esc(x.t)}</span><button class="del" data-d="${i}" aria-label="حذف الدرس">×</button></li>`).join(''):'<p class="mu" style="margin:0">لا توجد دروس لهذا اليوم. أضف أول درس.</p>';

  const all=Object.keys(db.days),w=keys(7);
  $('stats').innerHTML=[
    [streak(),'يوم متتالٍ بكل الصلوات'],
    [pct(7)+'%','التزام الصلاة آخر 7 أيام'],
    [pct(30)+'%','التزام الصلاة آخر 30 يوماً'],
    [mem(all),'درس محفوظ منذ البداية']
  ].map(([n,t])=>`<div class="stat"><strong>${n}</strong><span class="mu">${t}</span></div>`).join('');

  $('bars').innerHTML=w.map(k=>{const n=pc(k);return `<div class="bar"><b>${n}</b><i class="${n?'':'z'}" style="height:${n/5*80}%"></i><span>${pd(k).toLocaleDateString('ar',{weekday:'short'})}</span></div>`}).join('');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.p){const d=day(cur),s=+t.dataset.s;d.p[t.dataset.p]=d.p[t.dataset.p]===s?0:s;save();render()}
  else if(t.dataset.l){const x=day(cur).l[+t.dataset.l];x.s=(x.s+1)%3;save();render()}
  else if(t.dataset.d){day(cur).l.splice(+t.dataset.d,1);save();render()}
});
$('prev').onclick=()=>{const d=pd(cur);d.setDate(d.getDate()-1);cur=key(d);render()};
$('next').onclick=()=>{const d=pd(cur);d.setDate(d.getDate()+1);if(key(d)<=key(new Date())){cur=key(d);render()}};
$('lf').onsubmit=e=>{e.preventDefault();const v=$('lt').value.trim();if(!v)return;day(cur).l.push({t:v,s:0});$('lt').value='';save();render()};
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
  a.download='tracker-backup-'+key(new Date())+'.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!j||typeof j.days!=='object')throw 0;
      if(confirm('سيتم استبدال بياناتك الحالية بالنسخة المختارة. هل تريد المتابعة؟')){db=j;save();render()}
    }catch(_){alert('الملف غير صالح. اختر ملف نسخة احتياطية من هذه الصفحة.')}
  };
  r.readAsText(f);e.target.value='';
};
$('link').onclick=async()=>{
  try{
    if(fh){if(await fh.requestPermission({mode:'readwrite'})==='granted')await syncFromFile(false);return}
    fh=await showSaveFilePicker({suggestedName:'tracker-data.json',types:[{description:'ملف بيانات',accept:{'application/json':['.json']}}]});
    await idb('put','fh',fh);
    await syncFromFile(true);
  }catch(e){if(e&&e.name!=='AbortError')setSt('تعذر ربط الملف.')}
};
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(FS){
  $('link').hidden=false;
  idb('get','fh').then(async h=>{
    if(!h)return;fh=h;
    try{
      if(await h.queryPermission({mode:'readwrite'})==='granted')await syncFromFile(false);
      else setSt('الملف مربوط. اضغط «ربط ملف بياناتك» للسماح بالوصول إليه.');
    }catch(e){}
  });
}else setSt('متصفحك لا يدعم الربط المباشر بملف، فاستخدم النسخ الاحتياطي والاسترجاع.');
</script>
</body>
</html>
