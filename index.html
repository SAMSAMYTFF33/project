<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فهرس سور القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ec;--card:#fffdf7;--ink:#1d2b24;--gold:#b08a2e;--green:#1f5d46;--mute:#6b7a72;--line:#e3d9bd}
@media (prefers-color-scheme:dark){:root{--bg:#101a15;--card:#16231c;--ink:#ece6d3;--gold:#d4b25a;--green:#6fc4a0;--mute:#93a69b;--line:#2b3d33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri',serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{text-align:center;border:2px solid var(--gold);border-radius:18px;background:var(--card);padding:22px 12px;margin:12px 0 18px;outline:1px solid var(--line);outline-offset:-8px}
h1{font-family:'Amiri Quran','Amiri',serif;color:var(--green);font-size:2.2rem;margin:0 0 6px}
.meta{color:var(--mute)}
input{width:100%;font-family:inherit;font-size:1.1rem;padding:12px 16px;border-radius:999px;border:1px solid var(--gold);background:var(--card);color:var(--ink);margin-bottom:16px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.s{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.n{flex:none;width:38px;height:38px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:700}
.t{flex:1}
.t b{display:block;font-family:'Amiri Quran','Amiri',serif;font-size:1.3rem;color:var(--green)}
.t small{color:var(--mute)}
.go{flex:none;font-size:.85rem;background:var(--green);color:var(--card);padding:3px 10px;border-radius:999px}
.off{opacity:.55}
a.s:hover{border-color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:20px;display:none}
footer{text-align:center;color:var(--mute);margin:24px 0;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>فهرس سور القرآن الكريم</h1>
<div class="meta">١١٤ سورة · اضغط على سورة لفتحها</div>
</header>
<input id="q" type="search" placeholder="ابحث عن سورة…" autocomplete="off">
<div class="grid" id="list"></div>
<div class="empty" id="empty">لا توجد نتائج</div>
<footer>السور غير المتاحة ستُضاف قريبًا بإذن الله</footer>
</div>
<script>
var S=[["الفاتحة",7,0],["البقرة",286,1],["آل عمران",200,1],["النساء",176,1],["المائدة",120,1],["الأنعام",165,0],["الأعراف",206,0],["الأنفال",75,1],["التوبة",129,1],["يونس",109,0],["هود",123,0],["يوسف",111,0],["الرعد",43,1],["إبراهيم",52,0],["الحجر",99,0],["النحل",128,0],["الإسراء",111,0],["الكهف",110,0],["مريم",98,0],["طه",135,0],["الأنبياء",112,0],["الحج",78,1],["المؤمنون",118,0],["النور",64,1],["الفرقان",77,0],["الشعراء",227,0],["النمل",93,0],["القصص",88,0],["العنكبوت",69,0],["الروم",60,0],["لقمان",34,0],["السجدة",30,0],["الأحزاب",73,1],["سبأ",54,0],["فاطر",45,0],["يس",83,0],["الصافات",182,0],["ص",88,0],["الزمر",75,0],["غافر",85,0],["فصلت",54,0],["الشورى",53,0],["الزخرف",89,0],["الدخان",59,0],["الجاثية",37,0],["الأحقاف",35,0],["محمد",38,1],["الفتح",29,1],["الحجرات",18,1],["ق",45,0],["الذاريات",60,0],["الطور",49,0],["النجم",62,0],["القمر",55,0],["الرحمن",78,1],["الواقعة",96,0],["الحديد",29,1],["المجادلة",22,1],["الحشر",24,1],["الممتحنة",13,1],["الصف",14,1],["الجمعة",11,1],["المنافقون",11,1],["التغابن",18,1],["الطلاق",12,1],["التحريم",12,1],["الملك",30,0],["القلم",52,0],["الحاقة",52,0],["المعارج",44,0],["نوح",28,0],["الجن",28,0],["المزمل",20,0],["المدثر",56,0],["القيامة",40,0],["الإنسان",31,1],["المرسلات",50,0],["النبأ",40,0],["النازعات",46,0],["عبس",42,0],["التكوير",29,0],["الانفطار",19,0],["المطففين",36,0],["الانشقاق",25,0],["البروج",22,0],["الطارق",17,0],["الأعلى",19,0],["الغاشية",26,0],["الفجر",30,0],["البلد",20,0],["الشمس",15,0],["الليل",21,0],["الضحى",11,0],["الشرح",8,0],["التين",8,0],["العلق",19,0],["القدر",5,0],["البينة",8,1],["الزلزلة",8,1],["العاديات",11,0],["القارعة",11,0],["التكاثر",8,0],["العصر",3,0],["الهمزة",9,0],["الفيل",5,0],["قريش",4,0],["الماعون",7,0],["الكوثر",3,0],["الكافرون",6,0],["النصر",3,1],["المسد",5,0],["الإخلاص",4,0],["الفلق",5,0],["الناس",6,0]];
var SLUGS="al-fatiha,al-baqarah,aal-imran,an-nisa,al-maidah,al-anam,al-araf,al-anfal,at-tawbah,yunus,hud,yusuf,ar-rad,ibrahim,al-hijr,an-nahl,al-isra,al-kahf,maryam,ta-ha,al-anbiya,al-hajj,al-muminun,an-nur,al-furqan,ash-shuara,an-naml,al-qasas,al-ankabut,ar-rum,luqman,as-sajdah,al-ahzab,saba,fatir,ya-sin,as-saffat,sad,az-zumar,ghafir,fussilat,ash-shura,az-zukhruf,ad-dukhan,al-jathiyah,al-ahqaf,muhammad,al-fath,al-hujurat,qaf,adh-dhariyat,at-tur,an-najm,al-qamar,ar-rahman,al-waqiah,al-hadid,al-mujadilah,al-hashr,al-mumtahanah,as-saff,al-jumuah,al-munafiqun,at-taghabun,at-talaq,at-tahrim,al-mulk,al-qalam,al-haqqah,al-maarij,nuh,al-jinn,al-muzzammil,al-muddaththir,al-qiyamah,al-insan,al-mursalat,an-naba,an-naziat,abasa,at-takwir,al-infitar,al-mutaffifin,al-inshiqaq,al-buruj,at-tariq,al-ala,al-ghashiyah,al-fajr,al-balad,ash-shams,al-layl,ad-duha,ash-sharh,at-tin,al-alaq,al-qadr,al-bayyinah,az-zalzalah,al-adiyat,al-qariah,at-takathur,al-asr,al-humazah,al-fil,quraysh,al-maun,al-kawthar,al-kafirun,an-nasr,al-masad,al-ikhlas,al-falaq,an-nas".split(",");
/* أرقام السور التي رفعتَ صفحاتها فعلًا. أضف رقم السورة هنا عند رفع صفحتها */
var AVAILABLE=[2,18];
var PAGES={};
AVAILABLE.forEach(function(n){PAGES[n]="surat-"+SLUGS[n-1]+".html"});
var list=document.getElementById("list"),empty=document.getElementById("empty");
function ar(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})}
S.forEach(function(s,i){
  var no=i+1,href=PAGES[no];
  var el=document.createElement(href?"a":"div");
  el.className="s"+(href?"":" off");
  if(href)el.href=href;
  el.dataset.name=s[0];
  el.innerHTML='<span class="n">'+ar(no)+'</span><span class="t"><b>'+s[0]+'</b><small>'+(s[2]?"مدنية":"مكية")+' · '+ar(s[1])+' آية</small></span>'+(href?'<span class="go">افتح</span>':'');
  list.appendChild(el);
});
function norm(t){return t.replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim()}
document.getElementById("q").addEventListener("input",function(e){
  var v=norm(e.target.value),c=0;
  Array.prototype.forEach.call(list.children,function(el){
    var m=norm(el.dataset.name).indexOf(v)>-1;
    el.style.display=m?"":"none";if(m)c++;
  });
  empty.style.display=c?"none":"block";
});
</script>
</body>
</html>
