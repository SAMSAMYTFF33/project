<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بصمة الجهاز</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --text:#eaeaea; --muted:#9aa0ab; --accent:#4da3ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f7; --card:#ffffff; --text:#111; --muted:#666; --accent:#0068ff; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;
    padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  }
  h1{font-size:18px;margin:0 0 16px}
  .card{
    background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px;
  }
  .row{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid rgba(128,128,128,.15)}
  .row:last-child{border-bottom:none}
  .k{color:var(--muted); font-size:13px; flex:0 0 40%}
  .v{font-size:13px; word-break:break-all; text-align:left; flex:1}
  .section-title{color:var(--accent); font-size:14px; margin:18px 0 8px; font-weight:600}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-size:14px; width:100%; margin-top:10px;
  }
  #status{font-size:12px; color:var(--muted); margin-top:8px}
</style>
</head>
<body>
<h1>🔍 بصمة الجهاز الحالية</h1>
<div id="output"></div>
<button onclick="sendToBot()">إرسال البيانات للبوت</button>
<div id="status"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function addSection(title){
  const t = document.createElement('div');
  t.className = 'section-title';
  t.textContent = title;
  document.getElementById('output').appendChild(t);
  const card = document.createElement('div');
  card.className = 'card';
  document.getElementById('output').appendChild(card);
  return card;
}
function addRow(card, k, v){
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="k">${k}</div><div class="v">${v ?? '—'}</div>`;
  card.appendChild(row);
}

async function collectFingerprint(){
  const data = {};

  // --- معلومات المتصفح / النظام ---
  const nav = navigator;
  data.userAgent = nav.userAgent;
  data.platform = nav.platform;
  data.language = nav.language;
  data.languages = (nav.languages || []).join(', ');
  data.cookieEnabled = nav.cookieEnabled;
  data.doNotTrack = nav.doNotTrack;
  data.hardwareConcurrency = nav.hardwareConcurrency;
  data.deviceMemory = nav.deviceMemory;
  data.maxTouchPoints = nav.maxTouchPoints;
  data.vendor = nav.vendor;

  // --- الشاشة ---
  data.screenWidth = screen.width;
  data.screenHeight = screen.height;
  data.availWidth = screen.availWidth;
  data.availHeight = screen.availHeight;
  data.colorDepth = screen.colorDepth;
  data.pixelRatio = window.devicePixelRatio;
  data.orientation = screen.orientation?.type;

  // --- الوقت والمنطقة ---
  data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  data.timezoneOffset = new Date().getTimezoneOffset();

  // --- الشبكة ---
  const conn = nav.connection || nav.mozConnection || nav.webkitConnection;
  if (conn){
    data.connectionType = conn.effectiveType;
    data.downlink = conn.downlink;
    data.rtt = conn.rtt;
  }

  // --- Canvas Fingerprint ---
  try{
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillText('fingerprint-test-🔒', 2, 2);
    data.canvasFingerprint = canvas.toDataURL().slice(-32);
  }catch(e){ data.canvasFingerprint = 'غير متاح'; }

  // --- WebGL ---
  try{
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
    data.gpuVendor = gl.getParameter(dbgInfo.UNMASKED_VENDOR_WEBGL);
    data.gpuRenderer = gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL);
  }catch(e){ data.gpuVendor = data.gpuRenderer = 'غير متاح'; }

  // --- بطارية (إن توفرت) ---
  try{
    if (nav.getBattery){
      const bat = await nav.getBattery();
      data.batteryLevel = Math.round(bat.level*100)+'%';
      data.batteryCharging = bat.charging;
    }
  }catch(e){}

  // --- بيانات Telegram WebApp ---
  if (tg){
    data.tg_platform = tg.platform;
    data.tg_version = tg.version;
    data.tg_colorScheme = tg.colorScheme;
    data.tg_userId = tg.initDataUnsafe?.user?.id;
    data.tg_username = tg.initDataUnsafe?.user?.username;
    data.tg_first_name = tg.initDataUnsafe?.user?.first_name;
    data.tg_language_code = tg.initDataUnsafe?.user?.language_code;
  }

  return data;
}

let collected = null;

collectFingerprint().then(data=>{
  collected = data;

  const c1 = addSection('👤 تليجرام');
  addRow(c1,'User ID', data.tg_userId);
  addRow(c1,'اسم المستخدم', data.tg_username);
  addRow(c1,'الاسم', data.tg_first_name);
  addRow(c1,'المنصة', data.tg_platform);
  addRow(c1,'إصدار WebApp', data.tg_version);

  const c2 = addSection('💻 الجهاز والنظام');
  addRow(c2,'User Agent', data.userAgent);
  addRow(c2,'Platform', data.platform);
  addRow(c2,'اللغة', data.language);
  addRow(c2,'عدد الأنوية', data.hardwareConcurrency);
  addRow(c2,'الذاكرة (GB)', data.deviceMemory);
  addRow(c2,'نقاط اللمس', data.maxTouchPoints);
  addRow(c2,'GPU Vendor', data.gpuVendor);
  addRow(c2,'GPU Renderer', data.gpuRenderer);

  const c3 = addSection('🖥️ الشاشة');
  addRow(c3,'الدقة', `${data.screenWidth} × ${data.screenHeight}`);
  addRow(c3,'Pixel Ratio', data.pixelRatio);
  addRow(c3,'عمق الألوان', data.colorDepth);
  addRow(c3,'الاتجاه', data.orientation);

  const c4 = addSection('🌍 الوقت والشبكة');
  addRow(c4,'المنطقة الزمنية', data.timezone);
  addRow(c4,'نوع الاتصال', data.connectionType);
  addRow(c4,'Downlink (Mbps)', data.downlink);
  addRow(c4,'بطارية', data.batteryLevel ? `${data.batteryLevel} (${data.batteryCharging?'تشحن':'لا تشحن'})` : '—');

  const c5 = addSection('🔑 بصمة Canvas (مختصرة)');
  addRow(c5,'Canvas Hash', data.canvasFingerprint);
});

function sendToBot(){
  if (!tg || !collected){
    document.getElementById('status').textContent = 'الصفحة غير مفتوحة داخل تيليجرام أو لم تُجمع البيانات بعد.';
    return;
  }
  tg.sendData(JSON.stringify(collected));
  document.getElementById('status').textContent = '✅ تم إرسال البيانات للبوت.';
}
</script>
</body>
</html>
