<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المقررات الدراسية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#101a2e;color:#e8ebf2;
  font-family:'Noto Naskh Arabic',serif;line-height:1.9;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 64px)}
.box{max-width:560px;width:100%;text-align:center}
h1{font-family:'Amiri',serif;color:#f2c66d;font-size:clamp(2rem,6vw,2.8rem);margin-bottom:6px}
p{color:#9fabc2;margin-bottom:34px}
a.module{display:flex;align-items:center;gap:18px;text-align:right;text-decoration:none;padding:22px 26px;
  background:#17243d;color:#e8ebf2;border:1px solid #2b3b5c;border-radius:14px;border-inline-start:8px solid #f2c66d;
  transition:transform .2s,border-color .2s}
a.module:hover{transform:translateY(-3px);border-color:#5fd6c6}
a.module .ico{font-size:2.2rem;line-height:1}
a.module strong{display:block;font-family:'Amiri',serif;font-size:1.7rem;color:#5fd6c6;line-height:1.4}
a.module span{font-size:.95rem;color:#9fabc2}
:focus-visible{outline:3px solid #f2c66d;outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.module{transition:none}}
</style>
</head>
<body>
<main class="box">
  <h1>المقررات الدراسية</h1>
  <p>اختر المادة لعرض الدروس</p>
  <a class="module" href="Meurtre.html">
    <span class="ico" aria-hidden="true">⚖️</span>
    <div>
      <strong>القانون الجنائي</strong>
      <span>القتل العمد – الفصل 392</span>
    </div>
  </a>
</main>
</body>
</html>
